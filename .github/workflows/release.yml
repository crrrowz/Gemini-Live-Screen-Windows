name: Release & Package Extension

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Test & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Syntax Linter & Static Analysis
        run: npm run lint

      - name: Run Automated Test Suite
        run: npm test

      - name: Package Chrome Extension (.zip)
        run: |
          mkdir -p dist
          zip -r dist/gemini-live-screen-windows-${{ github.ref_name }}.zip \
            manifest.json \
            package.json \
            server.js \
            README.md \
            LICENSE \
            background/ \
            viewer/ \
            assets/ \
            -x "*.DS_Store" "*Thumbs.db"

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name }} - Gemini Live Screen for Windows"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          body_path: RELEASE_NOTES.md
          files: |
            dist/gemini-live-screen-windows-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
