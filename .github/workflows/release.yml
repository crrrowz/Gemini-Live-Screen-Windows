name: Release & Package Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Version (e.g. v1.0.1)'
        required: true
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Test & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Syntax Linter & Static Analysis
        run: npm run lint

      - name: Run Automated Test Suite
        run: npm test

      - name: Determine Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Auto-Sync Extension Version with Release Tag
        run: |
          RAW_TAG="${{ steps.vars.outputs.tag }}"
          CLEAN_VERSION="${RAW_TAG#v}"
          echo "Synchronizing manifest.json and package.json to version: $CLEAN_VERSION"
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            manifest.version = process.env.VER;
            fs.writeFileSync('manifest.json', JSON.stringify(manifest, null, 2) + '\n');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.env.VER;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
        env:
          VER: ${{ steps.vars.outputs.tag }}

      - name: Clean Version Number
        run: |
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            m.version = m.version.replace(/^v/, '');
            fs.writeFileSync('manifest.json', JSON.stringify(m, null, 2) + '\n');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.version = p.version.replace(/^v/, '');
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "

      - name: Package Chrome Extension (.zip)
        run: |
          mkdir -p dist
          zip -r dist/gemini-live-screen-windows-${{ steps.vars.outputs.tag }}.zip \
            manifest.json \
            package.json \
            server.js \
            register_native_host.bat \
            register_native_host_mac.sh \
            README.md \
            LICENSE \
            RELEASE_NOTES.md \
            background/ \
            viewer/ \
            assets/ \
            native_host/ \
            imgs/ \
            -x "*.DS_Store" "*Thumbs.db"

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ steps.vars.outputs.tag }} - Gemini Live Screen for Windows"
          tag_name: ${{ steps.vars.outputs.tag }}
          draft: false
          prerelease: false
          body_path: RELEASE_NOTES.md
          files: |
            dist/gemini-live-screen-windows-${{ steps.vars.outputs.tag }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
